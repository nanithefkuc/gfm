name: CI

# The recipes in `justfile` and `crate.just` are the only supported way to run
# a check, so every job below drives one. `just validate` is lint, deps, doc,
# features, test-tiers, unsafe-check and cover; those seven are split across
# jobs here for wall-clock, and the cross-build matrix and the dependency
# boundary are checks no recipe covers.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint + deps + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just lint
      - run: just deps
      - run: just doc

  features:
    name: feature closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just features

  tiers:
    name: test sweep over TIERS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # The host run plus one full suite per tier in `crate.just`'s `TIERS`.
      # `SIMD_BACKEND` is downgrade-only, so a green run is routing evidence
      # and not proof that the requested tier executed; the backend
      # fingerprint test reports what resolved.
      - run: just test-tiers

  unsafe:
    name: unsafe surface (miri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # `MIRI` in `crate.just` is empty for a crate that forbids unsafe, and
      # the recipe reports that and skips. The nightly toolchain is installed
      # so the job runs the argument sets the moment `MIRI` carries any.
      - run: just unsafe-check

  cover:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # One instrumented run per tier plus the no-default-features closure,
      # merged, then the line gate from `COV_MIN`. `COV_IGNORE` is empty, so
      # every line of the crate counts.
      - run: just cover

  cross:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, wasm32-wasip1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features

  msrv:
    name: msrv 1.93
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain name matches `MSRV` in `crate.just`, which `just msrv`
      # selects with `cargo +MSRV`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just msrv

  deps:
    name: dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `just deps` checks the allowlist; this job pins the exact set. fgf is
      # always present; rayon enters only with the parallel feature.
      # fgraph/lattica/butterfly-fft cross the stack's layering, while
      # simdispatch/archmage are reached through fgf, never directly. The
      # structured matrices (Cauchy, Vandermonde) are structmat's, downstream
      # of this crate: poly-ring and structmat must not return as
      # dependencies.
      - name: assert dependency set
        run: |
          base=$(cargo tree --no-default-features --edges normal --depth 1 --prefix none --no-dedupe \
                   | awk 'NF {print $1}' | sort -u | grep -v '^gfm$' || true)
          all=$(cargo tree --all-features --edges normal --depth 1 --prefix none --no-dedupe \
                   | awk 'NF {print $1}' | sort -u | grep -v '^gfm$' || true)
          echo "base direct dependencies: ${base:-<none>}"
          echo "all-feature direct dependencies: ${all:-<none>}"
          if [ "$base" != "fgf" ]; then
            echo "::error::expected fgf only without features, got: $base"
            exit 1
          fi
          if [ "$all" != "$(printf 'fgf\nrayon')" ]; then
            echo "::error::expected fgf and rayon with all features, got: $all"
            exit 1
          fi
          for forbidden in fgraph lattica butterfly-fft simdispatch archmage poly-ring structmat; do
            if echo "$all" | grep -qx "$forbidden"; then
              echo "::error::forbidden direct dependency: $forbidden"
              exit 1
            fi
          done
